<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dos caminos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@800&family=Roboto:wght@500&display=swap">
<style>
:root { --fondo:#F0F0F0; --sheet:#F7F3EE; --ink:#1F3547; --muted:#4A5A6A; --sky:#A9C4D6;
  --fd:"Roboto Condensed","Arial Narrow",Arial,sans-serif; --fb:"Roboto",system-ui,sans-serif; --ease:cubic-bezier(.16,1,.3,1); }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--fondo); color:var(--ink); font:16px/1.5 var(--fb); overflow:hidden; display:flex; align-items:center; }
.paths { width:100%; max-width:1120px; margin:0 auto; padding:12px 24px; display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.path { display:grid; gap:2px; text-decoration:none; color:var(--ink); padding:16px 20px; border-radius:16px; border:2px solid var(--ink); background:var(--sheet);
  opacity:0; animation:rise .8s var(--ease) forwards; transition:transform .2s ease, box-shadow .2s ease; cursor:pointer; }
.path:nth-child(1) { animation-delay:.15s; }
.path:nth-child(2) { animation-delay:.3s; }
.path:hover { transform:translateY(-3px); box-shadow:0 14px 30px rgba(31,53,71,.18); }
.path:focus-visible { outline:3px solid var(--sky); outline-offset:3px; }
.path b { font:800 21px/1.05 var(--fd); text-transform:uppercase; display:flex; justify-content:space-between; gap:12px; }
.path b i { font-style:normal; transition:transform .2s ease; }
.path:hover b i { transform:translateX(5px); }
.path span { font-size:14px; color:var(--muted); }
.path.primary { background:var(--ink); color:#fff; }
.path.primary span { color:var(--sky); }
@keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
@media (prefers-reduced-motion:reduce) { .path { animation:none; opacity:1; } }
@media (max-width:600px) {
  body { overflow:auto; }
  .paths { grid-template-columns:minmax(0,1fr); padding:10px 14px; gap:10px; }
  .path b { font-size:19px; }
}
</style>
</head>
<body>
<nav class="paths" aria-label="¿Qué estás buscando?">
  <a class="path primary" href="/construir-con-nosotros" data-destino="/construir-con-nosotros"><b>Quiero construir mi casa <i aria-hidden="true">→</i></b><span>Diseño, trámites, obra y reportes</span></a>
  <a class="path" href="/casas-en-venta" data-destino="/casas-en-venta"><b>Busco casa en venta <i aria-hidden="true">→</i></b><span>Casas listas, diseñadas por nosotros</span></a>
</nav>
<script>
(() => {
  // 1) El botón le avisa al código de la página (Velo) a dónde ir y la página hace el cambio.
  // 2) Si la página no contesta (sin código, ID distinto, etc.), el botón abre la página él mismo.
  const SITIO = "https://www.innovacionarquitecturaestudio.com";
  let pendiente = null;
  window.addEventListener("message", (e) => {
    if (e.data && e.data.tipo === "ir-ok") { clearTimeout(pendiente); pendiente = null; }
  });
  function abrir(url) {
    try { window.top.location.href = url; } catch (_) { window.open(url, "_blank", "noopener"); }
  }
  document.querySelectorAll("[data-destino]").forEach((a) => {
    a.href = SITIO + a.dataset.destino;
    a.target = "_top";
    a.addEventListener("click", (e) => {
      e.preventDefault();
      clearTimeout(pendiente);
      pendiente = setTimeout(() => abrir(a.href), 450);
      try { window.parent.postMessage({ tipo: "ir", destino: a.dataset.destino }, "*"); } catch (_) {}
    });
  });
})();
</script>
</body>
</html>
