<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cómo trabajamos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@600;800&family=Roboto+Mono:wght@500&family=Roboto:wght@400;500;700&display=swap">
<style>
:root { --paper:#EDE6DC; --sheet:#F7F3EE; --ink:#1F3547; --line:#1A4F6E; --slate:#63779A; --muted:#4A5A6A; --sky:#A9C4D6; --glass:#DDEFFB; --rule:rgba(31,53,71,.14);
  --fd:"Roboto Condensed","Arial Narrow",Arial,sans-serif; --fb:"Roboto",system-ui,sans-serif; --fm:"Roboto Mono",Consolas,monospace; }
* { box-sizing:border-box; }
body { margin:0; padding:4px; background:transparent; color:var(--ink); font:16px/1.5 var(--fb); }
.grid { display:grid; grid-template-columns:270px 1fr; gap:24px; }
.steps { display:flex; flex-direction:column; gap:6px; }
.step { display:grid; grid-template-columns:46px 1fr; align-items:center; text-align:left; gap:8px; background:transparent; border:1px solid transparent; border-radius:12px; padding:12px 14px; cursor:pointer; color:var(--muted); font:600 21px var(--fd); text-transform:uppercase; }
.step i { font:500 14px var(--fm); font-style:normal; color:var(--slate); }
.step[aria-selected="true"] { background:var(--sheet); border-color:var(--rule); color:var(--ink); }
.step:focus-visible { outline:3px solid var(--sky); outline-offset:2px; }
.panel { background:var(--sheet); border:1px solid var(--rule); border-radius:18px; padding:22px; display:grid; grid-template-columns:1fr 1fr; gap:24px; min-width:0; }
.eyebrow { font:500 13px var(--fm); letter-spacing:2px; text-transform:uppercase; color:var(--slate); margin:0; }
h3 { margin:10px 0 0; font:800 32px/1 var(--fd); text-transform:uppercase; }
p { margin:0; }
ul { margin:12px 0 0; padding:0; list-style:none; display:grid; gap:9px; }
li { display:flex; gap:10px; }
li::before { content:""; flex:none; width:10px; height:10px; margin-top:7px; border:2px solid var(--line); background:var(--glass); }
.bar { height:6px; background:var(--rule); border-radius:6px; margin-top:16px; overflow:hidden; }
.bar i { display:block; height:100%; background:var(--ink); transition:width .4s ease; }
figure { margin:0; position:relative; border-radius:14px; overflow:hidden; background:var(--glass); min-height:250px; }
figure img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
figcaption { position:absolute; left:10px; bottom:10px; background:rgba(20,33,44,.78); color:#fff; font:500 12px var(--fm); padding:5px 9px; border-radius:6px; }
@media (prefers-reduced-motion:no-preference) { .panel > * { animation:f .35s ease both; } @keyframes f { from { opacity:.4; transform:translateY(6px); } to { opacity:1; transform:none; } } }
@media (max-width:760px) {
  .grid { grid-template-columns:1fr; }
  .steps { flex-direction:row; overflow-x:auto; padding-bottom:6px; }
  .step { grid-template-columns:auto; font-size:16px; white-space:nowrap; }
  .panel { grid-template-columns:1fr; }
  figure { min-height:220px; }
}
@media (max-width:320px) { figure { min-height:180px; } }
</style>
</head>
<body>
<div class="grid">
  <div class="steps" role="tablist" aria-label="Etapas" id="tabs"></div>
  <div class="panel" role="tabpanel" id="panel" aria-live="polite"></div>
</div>
<script>
(() => {
  const IMG = (id, ext) => `https://static.wixstatic.com/media/${id}/v1/fit/w_900,h_900,q_85/foto.${ext}`;
  const STEPS = [
    { t: "Diseño", d: "Escuchamos cómo vive tu familia y diseñamos tu casa a la medida de tu terreno y tu presupuesto.", get: ["Planos arquitectónicos", "Renders de fachada e interiores", "Presupuesto de obra por etapas"], img: "img/materiales-diseno.webp", cap: "Selección de materiales y acabados" },
    { t: "Trámites", d: "Preparamos la documentación y gestionamos la licencia de construcción y los permisos ante el municipio.", get: ["Planos para la licencia", "Seguimiento de cada trámite", "Tú no haces filas"], img: IMG("f47f29_3b9d59af309240e8aa8bf0d70f2aecb2~mv2.jpg", "jpg"), cap: "Proyecto · Planta alta de Casa La Morena" },
    { t: "Personal", d: "Coordinamos albañilería, electricidad y fontanería con personal calificado y un solo responsable de obra.", get: ["Un responsable de obra", "Oficios coordinados", "Calendario de trabajos"], img: IMG("f47f29_baa86e7db9e7466fa5f93ed0b27d69b5~mv2.jpg", "jpg"), cap: "Foto de obra" },
    { t: "Avance de obra", d: "Supervisamos cada etapa: cimentación, estructura, muros y acabados, cuidando calidad y tiempos.", get: ["Supervisión en cada etapa", "Control de materiales", "Calidad revisada antes de avanzar"], img: "img/avance-obra.webp", cap: "Supervisión en obra" },
    { t: "Reportes", d: "Te enviamos reportes con fotos y porcentaje de avance para que sepas cómo va tu obra, estés donde estés.", get: ["Fotos de cada etapa", "Porcentaje de avance", "Próximos pasos de la obra"], img: IMG("f47f29_09ecb2daf2b24be7abc09a384e404f56~mv2.png", "png"), cap: "Render · Cocina de Casa La Morena" },
  ];
  const tabs = document.getElementById("tabs"), panel = document.getElementById("panel");
  STEPS.forEach((s, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "step"; b.id = "t" + i; b.setAttribute("role", "tab"); b.setAttribute("aria-controls", "panel");
    b.innerHTML = `<i>0${i + 1}</i>${s.t}`;
    b.onclick = () => show(i);
    b.onkeydown = (e) => {
      if (["ArrowDown", "ArrowRight"].includes(e.key)) { e.preventDefault(); show((i + 1) % 5, true); }
      if (["ArrowUp", "ArrowLeft"].includes(e.key)) { e.preventDefault(); show((i + 4) % 5, true); }
    };
    tabs.appendChild(b);
  });
  function show(i, focus) {
    [...tabs.children].forEach((b, k) => { b.setAttribute("aria-selected", k === i); b.tabIndex = k === i ? 0 : -1; });
    if (focus) tabs.children[i].focus();
    const s = STEPS[i];
    panel.setAttribute("aria-labelledby", "t" + i);
    panel.innerHTML = `<div><p class="eyebrow">Etapa ${i + 1} de 5</p><h3>${s.t}</h3><p style="margin-top:12px;color:var(--muted)">${s.d}</p><p style="margin-top:16px;font-weight:700">Lo que recibes</p><ul>${s.get.map((g) => `<li>${g}</li>`).join("")}</ul><div class="bar"><i style="width:${(i + 1) * 20}%"></i></div></div><figure><img src="${s.img}" alt="${s.cap}"><figcaption>${s.cap}</figcaption></figure>`;
  }
  STEPS.forEach((s) => { const im = new Image(); im.src = s.img; });
  show(0);
})();
</script>
</body>
</html>
