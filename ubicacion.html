<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ubicación</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@800&family=Roboto+Mono:wght@500;700&family=Roboto:wght@400;500&display=swap">
<style>
:root { --fondo:#F0F0F0; --sheet:#F7F3EE; --ink:#1F3547; --line:#1A4F6E; --slate:#63779A; --muted:#4A5A6A; --sky:#A9C4D6; --rule:#D3D9E0;
  --ok:#2E7D5B; --no:#A8553A;
  --fd:"Roboto Condensed","Arial Narrow",Arial,sans-serif; --fb:"Roboto",system-ui,sans-serif; --fm:"Roboto Mono",Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1); }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--fondo); color:var(--ink); font:16px/1.5 var(--fb); overflow:hidden; }
.wrap { max-width:1040px; margin:0 auto; padding:24px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:28px; align-items:stretch; }

.info { display:grid; align-content:start; gap:14px; opacity:0; transform:translateY(12px); animation:entra .7s var(--ease) .1s forwards; }
.eyebrow { margin:0; font:500 12px var(--fm); letter-spacing:2.5px; text-transform:uppercase; color:var(--slate); }
h2 { margin:-8px 0 0; font:800 30px/1.05 var(--fd); text-transform:uppercase; }
.dir { margin:0; font-size:17px; }
.dir small { display:block; color:var(--muted); font-size:14px; }

.estado { display:inline-flex; align-items:center; gap:10px; justify-self:start; padding:6px 14px; border-radius:999px; background:var(--sheet); border:1.5px solid var(--rule); font:500 14px var(--fb); }
.estado i { width:10px; height:10px; border-radius:50%; background:var(--slate); }
.estado.abierto i { background:var(--ok); box-shadow:0 0 0 0 rgba(46,125,91,.5); animation:late 1.8s ease-out infinite; }
.estado.cerrado i { background:var(--no); }
.estado b { font-weight:700; }

.horario { margin:0; padding:0; list-style:none; border-top:1px solid var(--rule); }
.horario li { display:flex; justify-content:space-between; gap:12px; padding:8px 10px; border-bottom:1px solid var(--rule); font-size:14px; color:var(--muted); }
.horario li span:last-child { font-family:var(--fm); font-size:13px; }
.horario li.hoy { background:var(--sheet); color:var(--ink); font-weight:500; border-radius:6px; }
.horario li.hoy span:first-child::after { content:" · hoy"; color:var(--slate); font-weight:400; }

.botones { display:flex; flex-wrap:wrap; gap:10px; margin-top:4px; }
.btn { display:inline-flex; align-items:center; gap:8px; padding:11px 18px; border-radius:12px; border:2px solid var(--ink); text-decoration:none; font:800 15px var(--fd); text-transform:uppercase; letter-spacing:.5px; color:var(--ink); background:var(--sheet); transition:transform .2s ease, box-shadow .2s ease; }
.btn:hover { transform:translateY(-2px); box-shadow:0 12px 24px rgba(31,53,71,.16); }
.btn.primary { background:var(--ink); color:#fff; }
.btn:focus-visible { outline:3px solid var(--sky); outline-offset:3px; }

.mapa { position:relative; border-radius:18px; overflow:hidden; border:1.5px solid var(--rule); min-height:340px; background:var(--sheet); opacity:0; transform:scale(.97); animation:entra .8s var(--ease) .25s forwards; }
.mapa iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }

@keyframes entra { to { opacity:1; transform:none; } }
@keyframes late { 70% { box-shadow:0 0 0 9px rgba(46,125,91,0); } 100% { box-shadow:0 0 0 0 rgba(46,125,91,0); } }
@media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation-duration:.01ms !important; animation-delay:0s !important; animation-iteration-count:1 !important; } }

@media (max-width:700px) {
  body { overflow:auto; }
  .wrap { grid-template-columns:minmax(0,1fr); padding:18px 14px; gap:18px; }
  h2 { font-size:24px; }
  .mapa { min-height:260px; }
  .btn { flex:1 1 auto; justify-content:center; }
}
</style>
</head>
<body>
<main class="wrap">
  <section class="info">
    <p class="eyebrow">Visítanos</p>
    <h2>Nuestra oficina</h2>
    <p class="dir">Álvaro Obregón 433, Col. Centro<small>47800 Ocotlán, Jalisco</small></p>
    <div class="estado" id="estado" aria-live="polite"><i></i><span id="estado-txt">Horario de atención</span></div>
    <ul class="horario" id="horario"></ul>
    <div class="botones">
      <a class="btn primary" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=20.3531122,-102.7722155">Cómo llegar →</a>
      <a class="btn" target="_blank" rel="noopener" href="https://wa.me/523111455359?text=Hola%2C%20me%20gustar%C3%ADa%20agendar%20una%20cita%20en%20su%20oficina.">Agendar cita</a>
    </div>
  </section>
  <div class="mapa">
    <iframe title="Mapa de la oficina de Innovación Arquitectura Estudio" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
      src="https://maps.google.com/maps?q=20.3531122,-102.7722155&z=17&hl=es&output=embed"></iframe>
  </div>
</main>
<script>
(() => {
  // Horario (igual que en Google). Horas en formato 24 h; null = cerrado. 0 = domingo.
  const HORARIO = [
    { dia: "Domingo",   abre: null, cierra: null },
    { dia: "Lunes",     abre: 9, cierra: 18 },
    { dia: "Martes",    abre: 9, cierra: 18 },
    { dia: "Miércoles", abre: 9, cierra: 18 },
    { dia: "Jueves",    abre: 9, cierra: 18 },
    { dia: "Viernes",   abre: 9, cierra: 18 },
    { dia: "Sábado",    abre: 9, cierra: 14 },
  ];
  const h12 = (h) => (h % 12 || 12) + (h < 12 ? " a.m." : " p.m.");
  const rango = (d) => d.abre === null ? "Cerrado" : h12(d.abre) + " – " + h12(d.cierra);

  // Hora de Ocotlán, aunque el visitante esté en otro huso horario
  function ahoraOcotlan() {
    const p = new Intl.DateTimeFormat("en-US", { timeZone: "America/Mexico_City", weekday: "short", hour: "numeric", minute: "numeric", hour12: false }).formatToParts(new Date());
    const v = (t) => p.find((x) => x.type === t).value;
    const dias = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };
    return { dia: dias[v("weekday")], hora: (+v("hour") % 24) + (+v("minute")) / 60 };
  }

  const lista = document.getElementById("horario"), estado = document.getElementById("estado"), txt = document.getElementById("estado-txt");
  // Días seguidos con el mismo horario van en un solo renglón (lunes primero, domingo al final)
  const grupos = [];
  [1, 2, 3, 4, 5, 6, 0].forEach((i) => {
    const g = grupos[grupos.length - 1];
    if (g && rango(HORARIO[g.dias[0]]) === rango(HORARIO[i])) g.dias.push(i); else grupos.push({ dias: [i] });
  });
  grupos.forEach((g) => {
    const li = document.createElement("li"); li.dataset.dias = g.dias.join(",");
    const nombre = g.dias.length > 1 ? HORARIO[g.dias[0]].dia + " a " + HORARIO[g.dias[g.dias.length - 1]].dia.toLowerCase() : HORARIO[g.dias[0]].dia;
    li.innerHTML = "<span>" + nombre + "</span><span>" + rango(HORARIO[g.dias[0]]) + "</span>";
    lista.appendChild(li);
  });

  function actualizar() {
    const { dia, hora } = ahoraOcotlan(), hoy = HORARIO[dia];
    lista.querySelectorAll("li").forEach((li) => li.classList.toggle("hoy", li.dataset.dias.split(",").includes(String(dia))));
    const abierto = hoy.abre !== null && hora >= hoy.abre && hora < hoy.cierra;
    estado.className = "estado " + (abierto ? "abierto" : "cerrado");
    if (abierto) { txt.innerHTML = "<b>Abierto ahora</b> · cierra a las " + h12(hoy.cierra); return; }
    // Próxima apertura
    for (let k = 0; k < 8; k++) {
      const d = HORARIO[(dia + k) % 7];
      if (d.abre === null || (k === 0 && hora >= d.abre)) continue;
      const cuando = k === 0 ? "hoy" : k === 1 ? "mañana" : "el " + d.dia.toLowerCase();
      txt.innerHTML = "<b>Cerrado</b> · abre " + cuando + " a las " + h12(d.abre);
      return;
    }
  }
  actualizar();
  setInterval(actualizar, 60000);
})();
</script>
</body>
</html>
