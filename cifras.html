<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cifras</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500;700&family=Roboto:wght@400;500&display=swap">
<style>
:root { --fondo:#F0F0F0; --ink:#1F3547; --slate:#63779A; --muted:#4A5A6A; --rule:rgba(31,53,71,.14);
  --fb:"Roboto",system-ui,sans-serif; --fm:"Roboto Mono",Consolas,monospace;
  --h:56px; /* alto de cada dígito */ }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--fondo); color:var(--ink); font:16px/1.4 var(--fb); overflow:hidden; display:flex; align-items:center; }
.grid { width:100%; max-width:1120px; margin:0 auto; padding:16px 24px; display:grid; grid-template-columns:repeat(4,1fr); align-items:start; }
.item { padding:10px 18px; border-left:1px solid var(--rule); display:grid; gap:10px; justify-items:start; align-content:start; }
.item:first-child { border-left:0; }

/* Contador de rodillos */
.counter { display:flex; align-items:center; gap:3px; }
.affix { font:700 30px var(--fm); color:var(--ink); padding:0 2px; }
.sep { font:700 30px var(--fm); color:var(--ink); width:12px; text-align:center; align-self:flex-end; line-height:var(--h); }
.win { position:relative; width:40px; height:var(--h); overflow:hidden; border-radius:7px;
  background:linear-gradient(#16283A, #1F3547 45%, #1F3547 55%, #16283A);
  box-shadow:inset 0 3px 6px rgba(0,0,0,.45), inset 0 -3px 6px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.6); }
.win::before { content:""; position:absolute; inset:0; z-index:2; pointer-events:none;
  background:linear-gradient(rgba(0,0,0,.35), transparent 28%, transparent 72%, rgba(0,0,0,.35)); }
.win::after { content:""; position:absolute; left:0; right:0; top:50%; height:1px; z-index:2; background:rgba(255,255,255,.08); }
.strip { display:flex; flex-direction:column; will-change:transform; }
.strip span { height:var(--h); display:grid; place-items:center; font:700 32px var(--fm); color:#F4F1EC; font-variant-numeric:tabular-nums; }
.label { font-size:14px; color:var(--muted); max-width:22ch; }

@media (max-width:720px) {
  body { overflow:auto; }
  :root { --h:46px; }
  .grid { grid-template-columns:1fr 1fr; padding:14px 12px; row-gap:22px; }
  .item { padding:6px 10px; }
  .item:nth-child(3) { border-left:0; }
  .win { width:32px; }
  .strip span { font-size:26px; }
  .affix, .sep { font-size:24px; }
  .label { font-size:13px; }
}
@media (max-width:480px) {
  .grid { grid-template-columns:minmax(0,1fr); row-gap:12px; padding:12px 14px; }
  .item, .item:nth-child(3) { border-left:0; display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; padding:2px 0; }
  .label { max-width:none; min-width:0; }
}
</style>
</head>
<body>
<main class="grid" id="grid" aria-label="Cifras de Innovación Arquitectura Estudio"></main>
<script>
(() => {
  // Cifras: cambia aquí los valores y textos
  const CIFRAS = [
    { valor: 12,   antes: "",  despues: "",   texto: "años de experiencia" },
    { valor: 55,   antes: "",  despues: "",   texto: "casas entregadas" },
    { valor: 5230, antes: "",  despues: "m²", texto: "construidos", miles: true },
    { valor: 5,    antes: "",  despues: "",   texto: "etapas acompañadas, del diseño a la entrega" },
  ];
  const VUELTAS = 3;      // vueltas extra de las unidades (las demás giran menos)
  const DURACION = 2200;  // milisegundos por contador
  const ESCALON = 180;    // retraso entre un contador y el siguiente

  const grid = document.getElementById("grid");
  const quieto = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  const columnas = [];

  CIFRAS.forEach((c, n) => {
    const item = document.createElement("div");
    item.className = "item";
    const counter = document.createElement("div");
    counter.className = "counter";
    counter.setAttribute("role", "img");
    counter.setAttribute("aria-label", `${c.antes}${c.valor.toLocaleString("es-MX")} ${c.despues} ${c.texto}`.trim());
    if (c.antes) counter.insertAdjacentHTML("beforeend", `<span class="affix" aria-hidden="true">${c.antes}</span>`);
    const digits = String(c.valor).split("");
    digits.forEach((d, i) => {
      const fromRight = digits.length - 1 - i;
      const win = document.createElement("div");
      win.className = "win";
      win.setAttribute("aria-hidden", "true");
      const strip = document.createElement("div");
      strip.className = "strip";
      const spins = Math.max(0, VUELTAS - fromRight);
      const total = spins * 10 + Number(d);
      for (let k = 0; k <= total; k++) strip.insertAdjacentHTML("beforeend", `<span>${k % 10}</span>`);
      win.appendChild(strip);
      counter.appendChild(win);
      columnas.push({ strip, total, delay: n * ESCALON + i * 60 });
      // separador de miles después de este dígito
      if (c.miles && fromRight > 0 && fromRight % 3 === 0) counter.insertAdjacentHTML("beforeend", `<span class="sep" aria-hidden="true">,</span>`);
    });
    if (c.despues) counter.insertAdjacentHTML("beforeend", `<span class="affix" aria-hidden="true" style="font-size:22px">${c.despues}</span>`);
    item.appendChild(counter);
    item.insertAdjacentHTML("beforeend", `<span class="label">${c.texto}</span>`);
    grid.appendChild(item);
  });

  const alto = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--h"));
  function colocar(final) {
    const h = alto();
    columnas.forEach((c) => {
      c.strip.style.transition = final ? "none" : "";
      c.strip.style.transform = `translateY(${-(final ? c.total : 0) * h}px)`;
    });
  }
  function girar() {
    const h = alto();
    columnas.forEach((c) => {
      c.strip.style.transition = `transform ${DURACION}ms cubic-bezier(.2,.75,.25,1.04) ${c.delay}ms`;
      c.strip.style.transform = `translateY(${-c.total * h}px)`;
    });
  }

  if (quieto || !("IntersectionObserver" in window)) { colocar(true); return; }
  colocar(false);
  let hecho = false;
  const io = new IntersectionObserver((entries) => {
    if (!hecho && entries.some((e) => e.isIntersecting)) { hecho = true; requestAnimationFrame(() => requestAnimationFrame(girar)); io.disconnect(); }
  }, { threshold: 0.4 });
  io.observe(grid);
  window.addEventListener("resize", () => { if (hecho) colocar(true); });
})();
</script>
</body>
</html>
