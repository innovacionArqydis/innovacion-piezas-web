<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preguntas frecuentes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@800&family=Roboto+Mono:wght@500&family=Roboto:wght@400;500;700&display=swap">
<style>
:root { --fondo:#F0F0F0; --card:#FFFFFF; --ink:#1F3547; --slate:#63779A; --muted:#4A5A6A; --sky:#A9C4D6; --glass:#DDEFFB; --chat:#EDE6DC; --rule:rgba(31,53,71,.14);
  --fd:"Roboto Condensed","Arial Narrow",Arial,sans-serif; --fb:"Roboto",system-ui,sans-serif; --fm:"Roboto Mono",Consolas,monospace; }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--fondo); color:var(--ink); font:16px/1.5 var(--fb); overflow:hidden; }
.wrap { height:100%; max-width:1120px; margin:0 auto; padding:12px 16px; display:grid; grid-template-columns:.9fr 1.1fr; gap:20px; }

/* Preguntas */
.ask { display:flex; flex-direction:column; gap:10px; min-height:0; min-width:0; }
.eyebrow { margin:0; font:500 13px var(--fm); letter-spacing:2px; text-transform:uppercase; color:var(--slate); }
.qs { display:flex; flex-direction:column; gap:8px; overflow:auto; padding:2px; }
.q { text-align:left; border:2px solid var(--rule); background:var(--card); color:var(--ink); border-radius:14px; padding:12px 14px; font:500 15px/1.35 var(--fb); cursor:pointer; display:flex; justify-content:space-between; gap:10px; transition:border-color .15s ease, transform .15s ease; }
.q:hover { border-color:var(--slate); transform:translateX(3px); }
.q:focus-visible { outline:3px solid var(--sky); outline-offset:2px; }
.q[aria-pressed="true"] { border-color:var(--ink); background:var(--glass); }
.q i { font-style:normal; color:var(--slate); flex:none; }

/* Conversación */
.chat { background:var(--card); border:1px solid var(--rule); border-radius:18px; overflow:hidden; display:grid; grid-template-rows:auto minmax(0,1fr) auto; grid-template-columns:minmax(0,1fr); min-height:0; min-width:0; }
.head { display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--ink); color:#fff; }
.head .av { width:38px; height:38px; border-radius:50%; background:#63779A; display:grid; place-items:center; flex:none; }
.head .av svg { width:22px; height:auto; }
.head > div:last-child { min-width:0; }
.head b { display:block; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.head small { display:block; font-size:12px; color:var(--sky); }
.msgs { background:var(--chat); padding:16px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; scroll-behavior:smooth; }
.b { max-width:85%; overflow-wrap:anywhere; padding:10px 14px; border-radius:14px; font-size:15px; line-height:1.45; box-shadow:0 1px 1px rgba(0,0,0,.08); animation:pop .28s cubic-bezier(.16,1,.3,1) both; }
.b.yo { align-self:flex-end; background:var(--ink); color:#fff; border-bottom-right-radius:4px; }
.b.ellos { align-self:flex-start; background:#fff; color:var(--ink); border-bottom-left-radius:4px; }
.b.typing { display:flex; gap:5px; padding:14px 16px; }
.b.typing span { width:7px; height:7px; border-radius:50%; background:var(--slate); animation:dot 1s infinite ease-in-out; }
.b.typing span:nth-child(2) { animation-delay:.15s; } .b.typing span:nth-child(3) { animation-delay:.3s; }
.hint { align-self:center; font:500 12px var(--fm); color:var(--muted); background:rgba(255,255,255,.7); padding:4px 10px; border-radius:999px; text-align:center; }
.foot { padding:12px 16px; border-top:1px solid var(--rule); display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
.foot span { font-size:14px; color:var(--muted); }
.wa { display:inline-flex; align-items:center; gap:8px; min-height:42px; padding:0 16px; border-radius:999px; background:var(--ink); color:#fff; text-decoration:none; font:700 14px var(--fb); }
.wa svg { width:18px; height:18px; }
@keyframes pop { from { opacity:0; transform:translateY(8px) scale(.97); } to { opacity:1; transform:none; } }
@keyframes dot { 0%, 80%, 100% { transform:translateY(0); opacity:.5; } 40% { transform:translateY(-4px); opacity:1; } }
@media (prefers-reduced-motion:reduce) { .b, .b.typing span { animation:none; } .msgs { scroll-behavior:auto; } }

@media (max-width:760px) {
  .wrap { grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); gap:12px; padding:10px 12px; }
  .qs { flex-direction:row; overflow-x:auto; padding-bottom:6px; }
  .q { flex:none; width:210px; }
  .q:hover { transform:none; }
}
</style>
</head>
<body>
<main class="wrap">
  <section class="ask" aria-label="Preguntas">
    <p class="eyebrow">Toca una pregunta</p>
    <div class="qs" id="qs"></div>
  </section>
  <section class="chat" aria-label="Respuestas">
    <div class="head">
      <div class="av" aria-hidden="true"><svg viewBox="148 140 338 468"><polygon points="286,215 360,182 360,548 286,548" fill="#fff"/><polygon points="199,377 237,352 306,391 306,548 199,548" fill="#fff"/><polygon points="339,456 401,432 434,447 434,548 339,548" fill="#fff"/><path d="M286,380 L286,215 L360,182 L360,456 M199,548 L199,377 L237,352 L306,391 L306,548 M339,548 L339,456 L401,432 L434,447 L434,548 M190,548 L442,548" fill="none" stroke="#1A4F6E" stroke-width="12"/></svg></div>
      <div><b>Innovación Arquitectura Estudio</b><small>Responde al instante</small></div>
    </div>
    <div class="msgs" id="msgs" aria-live="polite">
      <p class="hint">Elige una pregunta y te respondemos aquí</p>
    </div>
    <div class="foot">
      <span>¿Tienes otra pregunta?</span>
      <a class="wa" id="wa" target="_blank" rel="noopener" href="#"><svg viewBox="-40 -40 80 80" aria-hidden="true"><path d="M-22,24 L-28,32 L-17,28 A30,30 0 1 0 -22,24 Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/><path d="M-11,-14 C-15,-8 -12,2 -4,9 C4,16 13,18 17,13 L18,8 L10,3 L6,7 C2,5 -3,0 -5,-4 L-1,-8 L-6,-16 Z" fill="currentColor"/></svg>Escríbenos por WhatsApp</a>
    </div>
  </section>
</main>
<script>
(() => {
  // Preguntas y respuestas: cambia o agrega aquí
  const PREGUNTAS = [
    { p: "¿Cuánto cuesta construir mi casa?", r: "Depende del terreno, el diseño, los metros y los acabados que elijas. Por eso hacemos cada presupuesto a la medida: platicamos de tu proyecto, visitamos tu terreno y te entregamos un presupuesto detallado por etapas." },
    { p: "¿Ustedes se encargan de los permisos de construcción?", r: "Sí. Preparamos la documentación y damos seguimiento a la licencia de construcción y los trámites necesarios ante el municipio." },
    { p: "¿Cuánto tiempo tarda la obra?", r: "Depende del tamaño, los niveles y los acabados. Desde el inicio te entregamos un calendario de obra por etapas y te avisamos de cualquier cambio en los reportes." },
    { p: "¿Cómo me entero del avance?", r: "Recibes reportes con fotos y el porcentaje de avance de cada etapa: cimentación, estructura, muros y acabados." },
    { p: "Ya tengo mi proyecto, ¿solo pueden construirlo?", r: "Sí. Revisamos tus planos, te damos presupuesto de construcción y nos encargamos de la obra." },
  ];
  const TELEFONO = "523111455359";

  const qs = document.getElementById("qs"), msgs = document.getElementById("msgs");
  const quieto = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  let ocupado = false;
  document.getElementById("wa").href = `https://wa.me/${TELEFONO}?text=${encodeURIComponent("Hola, tengo una pregunta sobre construir mi casa:")}`;

  const burbuja = (cls, texto) => {
    const d = document.createElement("div");
    d.className = "b " + cls;
    if (texto != null) d.textContent = texto;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
  };

  function responder(i, boton) {
    if (ocupado) return;
    ocupado = true;
    qs.querySelectorAll(".q").forEach((b) => b.setAttribute("aria-pressed", b === boton));
    const hint = msgs.querySelector(".hint");
    if (hint) hint.remove();
    const { p, r } = PREGUNTAS[i];
    burbuja("yo", p);
    const escribiendo = burbuja("ellos typing");
    escribiendo.setAttribute("aria-label", "Escribiendo");
    escribiendo.innerHTML = "<span></span><span></span><span></span>";
    // El «escribiendo…» dura según el largo de la respuesta (entre 0.7 y 1.6 s)
    const espera = quieto ? 0 : Math.min(1600, 700 + r.length * 4);
    setTimeout(() => {
      escribiendo.remove();
      burbuja("ellos", r);
      ocupado = false;
    }, espera);
  }

  PREGUNTAS.forEach(({ p }, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "q"; b.setAttribute("aria-pressed", "false");
    b.innerHTML = `<span></span><i aria-hidden="true">→</i>`;
    b.firstChild.textContent = p;
    b.addEventListener("click", () => responder(i, b));
    qs.appendChild(b);
  });
})();
</script>
</body>
</html>
